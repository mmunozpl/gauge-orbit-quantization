# versiones exactas del entorno que produjo los numeros de la nota;
# el lock se congela desde aqui, no desde un entorno limpio.
[project]
name = "gauge-orbit-quantization"
version = "1.0.0"
description = "La orbita de gauge valor-salida como espacio de diseno para cuantizacion"
readme = "LEEME.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Manuel Muñoz Plá", email = "mmunozpl@uoc.edu" },
]
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "timm==1.0.22",
    "transformers==4.57.1",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "tqdm==4.67.3",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

# torch y torchvision se toman del indice cu130, que es el build con
# que se corrio el barrido (RTX 5090, CUDA 13.0).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
